# =========================================================================
# Configuration for online btag tag & probe analysis for 2018 legacy
# =========================================================================

[Info]
process = MssmHbb
eventsMax = -1
signalRegion = true

ntuplesList = tools:2018/v6/mc/SUSYGluGluToBBHToBB_M-600_rootFileList.txt
isMC = true
nloMC  = true
output = histograms_Legacy2018_SUSYGluGluToBBHToBB_M-600_SR.root
json = tools:2018/certified/Cert_Run2018ABCD-DeepCSV_13TeV_Legacy2018_Collisions18_JSON.txt

[User]
workflow = 1
doTree = true
processId = PROCESS_ID

[Vertices]
primaryVertex = offlineSlimmedPrimaryVertices
primaryVertex.notFake = true
primaryVertex.ndofMin = 4.
primaryVertex.absZMax = 24.
primaryVertex.rhoMax  = 2.

[Trigger]
results   = TriggerResults
hltPath   = HLT_PATH
### L1 seed would only be needed if there is an OR of two seeds
#l1Seed    = L1_SEED

[Trigger.Objects]
directory = slimmedPatTrigger

[Trigger.Objects.Jets]
L1   = L1JET_OBJECT
Calo = CALOJET_OBJECT
PF   = PFJET_OBJECT 

[Trigger.Objects.BTag]
Calo = BTAG_OBJECT

[Jets]
jets = updatedJets
id = tight
puId = loose
nMin = 2
dRMin = 1.0
dPhiMin = 2.5
extendedFlavour = true
probe = 1
tag = 2
ptMin = PROBE_PTMIN
ptMax = PROBE_PTMAX
etaMax = 2.2
ptMin = TAG_PTMIN
ptMax = TAG_PTMAX
etaMax = 2.2

[BTag]
# definitions
nMin  = 2
algorithm = deepflavour
wp = PROBE_BTAG
wp = TAG_BTAG
# definitions
loose  = 0.0490
medium = 0.2783
tight  = 0.7100

[Generator]
genParticles = prunedGenParticles
genJets      = slimmedGenJets

[Histograms]
Jets.flavour = true

[Corrections.Jets]
bRegression = false
jerPtRes    = tools:2018/jer/Summer19UL18_JRV2_MC_PtResolution_AK4PFchs.txt
jerSF       = tools:2018/jer/Summer19UL18_JRV2_MC_SF_AK4PFchs.txt
onlinejetSF = tools:2018/jetonline/jetTriggerScaleFactors_MssmHbb_2018FH_UL.root

[Corrections.BTag]
SF           = tools:2018/btag/wp_deepJet_106XUL18_v2.csv

[Corrections.Pileup]
reweight  = tools:2018/pileup/run2_legacy/PileupWeight_MSSMHbb_mix_2018_UltraLegacy.root
